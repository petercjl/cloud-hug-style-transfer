name: Package QA
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CLOUD_HUG_AUTO_UPDATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install required media capability without service credentials
        run: npm install --global --ignore-scripts @petercjl/sealseek-media-cli@0.6.1
      - run: node npm/cli.mjs doctor --json
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run --json
