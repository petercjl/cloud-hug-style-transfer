name: Package QA
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CLOUD_HUG_AUTO_UPDATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # ToAPIs discovery and doctor use isolated fixtures in the test suite.
      # CI does not install a media provider or access service credentials.
      - run: npm run validate:release
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run --json
